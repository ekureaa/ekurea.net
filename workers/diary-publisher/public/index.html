<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffaf4">
    <meta name="robots" content="noindex, nofollow">
    <title>日記を書く</title>
    <link rel="icon" type="image/png" href="https://blog.ekurea.net/favicon.png">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <img src="https://blog.ekurea.net/favicon.png" alt="" width="56" height="56">
        <div>
          <p class="eyebrow">DIARY</p>
          <h1>日記を書く</h1>
        </div>
      </header>

      <form id="diary-form" novalidate>
        <label class="field">
          <span>タイトル <small>省略すると日付になります</small></span>
          <input id="title" name="title" type="text" maxlength="80" autocomplete="off">
        </label>

        <label class="field">
          <span>本文</span>
          <textarea id="body" name="body" maxlength="20000" required placeholder="今日のことを書く"></textarea>
        </label>

        <div class="field">
          <span>写真 <small>4枚まで・1枚10MBまで</small></span>
          <label class="photo-picker" for="photos">写真を選ぶ</label>
          <input id="photos" name="photos" class="visually-hidden" type="file" accept="image/*" multiple>
          <p id="photo-summary" class="photo-summary">写真は選択されていません</p>
          <div id="photo-preview" class="photo-preview" aria-live="polite"></div>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="publish-button" type="submit">公開する</button>
      </form>
    </main>
  </body>
</html>
