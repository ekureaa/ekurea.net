<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffaf4">
    <meta name="robots" content="noindex, nofollow">
    <title>日記を書く</title>
    <link rel="icon" type="image/png" href="https://blog.ekurea.net/favicon.png">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <img src="https://blog.ekurea.net/favicon.png" alt="" width="56" height="56">
        <div>
          <p class="eyebrow">DIARY</p>
          <h1>日記を書く</h1>
        </div>
      </header>

      <section class="draft-overview" aria-labelledby="draft-overview-title">
        <div class="draft-overview-heading">
          <div>
            <p class="eyebrow">DRAFT</p>
            <h2 id="draft-overview-title">下書きの状態</h2>
          </div>
          <span id="draft-status-badge" class="draft-status-badge" data-state="loading">読み込み中</span>
        </div>
        <label class="draft-date-field">
          <span>編集する日</span>
          <input id="entry-date" type="date">
        </label>
        <p id="draft-state-detail" class="draft-state-detail">今日の下書きを確認しています。</p>
        <p id="published-link" class="published-link" hidden></p>
      </section>

      <form id="diary-form" novalidate>
        <label class="field">
          <span>タイトル <small>省略すると日付になります</small></span>
          <input id="title" name="title" type="text" maxlength="80" autocomplete="off">
        </label>

        <section class="field editor-field" aria-labelledby="body-label">
          <div class="editor-heading">
            <span id="body-label">本文</span>
            <div class="editor-tabs" role="tablist" aria-label="本文の表示切り替え">
              <button id="edit-tab" class="editor-tab" type="button" role="tab" aria-selected="true" aria-controls="edit-panel">編集</button>
              <button id="preview-tab" class="editor-tab" type="button" role="tab" aria-selected="false" aria-controls="preview-panel">プレビュー</button>
            </div>
          </div>

          <div id="edit-panel" class="editor-panel" role="tabpanel" aria-labelledby="edit-tab">
            <div id="block-editor" class="block-editor"></div>
            <p id="photo-summary" class="photo-summary" aria-live="polite" hidden></p>
          </div>

          <div id="preview-panel" class="preview-panel" role="tabpanel" aria-labelledby="preview-tab" hidden>
            <article class="diary-preview">
              <p class="preview-label">表示イメージ</p>
              <h2 id="preview-title"></h2>
              <div id="preview-body" class="markdown-preview"></div>
            </article>
          </div>

          <input id="body" name="body" type="hidden">
          <input id="photo-input" class="visually-hidden" type="file" accept="image/*" multiple>
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="draft-actions">
          <button id="save-button" class="publish-button" type="submit">下書きを保存</button>
          <button id="ready-button" class="ready-button" type="button" aria-pressed="false" disabled>公開OK: OFF</button>
          <button id="manual-publish-button" class="manual-publish-button" type="button" hidden>手動で公開</button>
        </div>
        <p class="publish-help">公開OKの内容は毎日22時に公開します。22時を過ぎた下書きは、手動公開を使ってください。</p>
      </form>

      <dialog id="embed-dialog" class="embed-dialog">
        <form id="embed-form" class="embed-form" method="dialog">
          <div>
            <p class="embed-dialog-label">リンクを埋め込む</p>
            <h2>YouTube・XのURL</h2>
          </div>
          <label class="field">
            <span>URL</span>
            <input id="embed-url" type="url" inputmode="url" autocomplete="off" placeholder="https://youtu.be/... または https://x.com/..."><span class="embed-url-help">YouTube動画またはXの投稿URLを入力してください。</span>
          </label>
          <p id="embed-error" class="embed-error" role="alert"></p>
          <div class="embed-dialog-actions">
            <button id="embed-cancel" class="dialog-cancel" type="button">キャンセル</button>
            <button class="dialog-submit" type="submit">挿入する</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
